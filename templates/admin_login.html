
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrator Login</title>
    <style>
        * { box-sizing: border-box; font-family: Arial; }
        body {
            margin: 0;
            background: #17243a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            width: 380px;
            max-width: 92%;
            padding: 35px;
            border-radius: 15px;
        }
        h2 { color: #17243a; }
        p { color: #718096; font-size: 14px; }
        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin: 18px 0 8px;
        }
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce3ed;
            border-radius: 8px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #2468c5;
            color: white;
            border: 0;
            border-radius: 8px;
            margin-top: 24px;
            cursor: pointer;
        }
        .flash { padding: 12px; margin: 12px 0; border-radius: 8px; }
        .error { background: #fff0f0; color: #b42318; }
        .success { background: #e6f7ed; color: #167344; }
        a { display: block; text-align: center; margin-top: 20px; color: #2468c5; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Administrator Login</h2>
        <p>Sign in to manage the Business License Portal.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_login') }}">
            <label>Username</label>
            <input type="text" name="username" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Login</button>
        </form>

        <a href="{{ url_for('index') }}">Back to Dashboard</a>
    </div>
</body>
</html>

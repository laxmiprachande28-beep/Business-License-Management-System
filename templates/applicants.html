{% extends "base.html" %}
{% block content %}
<div class="page-heading">
    <h1>Applicants</h1>
    <a class="button" href="{{ url_for('add_applicant') }}">+ Register Applicant</a>
</div>
<div class="table-wrap">
<table>
<thead><tr><th>Name</th><th>Address</th><th>Phone</th><th>Email</th></tr></thead>
<tbody>
{% for r in records %}
<tr><td>{{ r.name }}</td><td>{{ r.address }}</td><td>{{ r.phone }}</td><td>{{ r.email }}</td></tr>
{% else %}
<tr><td colspan="4">No applicants found.</td></tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
